<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gulf-Market Arabic CV Rewriter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Gulf-Market Arabic CV Rewriter</h1>
  <p class="sub">Rough CV bullets in. Gulf-recruiter-ready Arabic out. Runs entirely on your machine.</p>
  <p id="status" class="status">Checking local model&hellip;</p>
</header>

<main>

  <section class="panel">
    <label for="input" class="label">Your bullet points</label>
    <textarea id="input" rows="10"
      placeholder="اكتب أو الصق نقاط سيرتك الذاتية هنا&#10;Paste your CV bullet points here — Arabic, English, dialect, or all three."></textarea>
  </section>

  <section class="controls">
    <fieldset>
      <legend>Target register</legend>
      <div class="options" id="register">
        <label><input type="radio" name="register" value="formal">
          <span><strong>Formal</strong><em>Government, banking</em></span></label>
        <label><input type="radio" name="register" value="corporate" checked>
          <span><strong>Corporate</strong><em>Multinationals</em></span></label>
        <label><input type="radio" name="register" value="tech">
          <span><strong>Tech</strong><em>Startups, engineering</em></span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Output language</legend>
      <div class="options" id="output">
        <label><input type="radio" name="output" value="ar">
          <span><strong>Arabic</strong></span></label>
        <label><input type="radio" name="output" value="en">
          <span><strong>English</strong></span></label>
        <label><input type="radio" name="output" value="both" checked>
          <span><strong>Both</strong></span></label>
      </div>
    </fieldset>

    <button id="go" class="primary">Rewrite</button>
  </section>

  <section id="results" class="results" hidden>
    <article class="card">
      <header class="card-head">
        <h2>Original</h2>
      </header>
      <div id="out-original" class="out"></div>
    </article>

    <article class="card" id="card-ar" hidden>
      <header class="card-head">
        <h2>Arabic</h2>
        <button class="copy" data-target="out-arabic">Copy</button>
      </header>
      <div id="out-arabic" class="out rtl" dir="rtl" lang="ar"></div>
    </article>

    <article class="card" id="card-en" hidden>
      <header class="card-head">
        <h2>English</h2>
        <button class="copy" data-target="out-english">Copy</button>
      </header>
      <div id="out-english" class="out" dir="ltr" lang="en"></div>
    </article>
  </section>

  <p id="error" class="error" hidden></p>

</main>

<script src="app.js"></script>
</body>
</html>
